name: Update Google Scholar Citation Data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"   # daily 08:15 UTC

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        working-directory: google_scholar_crawler
        run: pip install -r requirements.txt
      - name: Run Google Scholar crawler
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python main.py
      - name: Publish to google-scholar-stats branch
        run: |
          cd google_scholar_crawler/results
          git init -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update citation data ($(date -u +%Y-%m-%d))"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats --force
